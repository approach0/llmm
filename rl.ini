[DEFAULT]
no_tokenizer = None
7b_vicuna_v1_5 = lmsys/vicuna-7b-v1.5
test_lora_repo = Lajonbot/vicuna-7b-v1.5-PL-lora_adapter_model
seed = 42

[test]
batch_size = 1
context_length = 4096
tokenizer = %(7b_vicuna_v1_5)s
tokenizer_init_kwargs = {"use_fast": false}
model = %(7b_vicuna_v1_5)s
rerope = {"training_length": %(context_length)s}
peft: {
        "peft_attach_new": true
    }
ppo: {
        "lr": 3e-5,
        "batch_size": %(batch_size)s,
        "optimize_cuda_cache": true
    }

test_prompt: Hello, I am Aadhira,
    I recently want to go

[gpt2]
batch_size = 2
context_length = 512
tokenizer = gpt2
tokenizer_init_kwargs = {"use_fast": false}
tokenizer_special_tokens = {"pad_token": "[PAD]"}
model = gpt2
dataset = approach0/MATH-picky-test
collate_fn = collate_prompts
peft: {
        "peft_attach_new": false
    }
ppo: {
        "lr": 3e-5,
        "batch_size": %(batch_size)s,
        "optimize_cuda_cache": true
    }

[open_ai_gpt3_5]
batch_size = 1
context_length = 8000
tokenizer = %(no_tokenizer)s
model = openai_api
openai_init: {
        "env_token_key": "OAIKey",
        "api_type": "azure",
        "api_version": "2023-03-15-preview",
        "api_base": "https://corby.openai.azure.com",
        "engine": "gpt-35-turbo"
    }
openai_generate: {
        "temperature": 0.3,
        "max_tokens": %(context_length)s,
        "stop": null
    }
dataset = approach0/MATH-picky-test
collate_fn = collate_prompts

[train__7b_vicuna_v1_5]
batch_size = 1
context_length = 4096
tokenizer = %(7b_vicuna_v1_5)s
tokenizer_init_kwargs = {"use_fast": false}
model = %(7b_vicuna_v1_5)s
rerope = {"training_length": %(context_length)s}
dataset = approach0/MATH-picky-test
collate_fn = collate_prompts
peft: {
        "peft_attach_new": true
    }
ppo: {
        "lr": 3e-5,
        "batch_size": %(batch_size)s,
        "optimize_cuda_cache": true
    }
