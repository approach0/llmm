[DEFAULT]
7b_vicuna_v1_5 = lmsys/vicuna-7b-v1.5
test_lora_repo = Lajonbot/vicuna-7b-v1.5-PL-lora_adapter_model
13b_mathy_fft = approach0/mathy-vicuna-13B-FFT
seed = 42
output_dir = ./output

[test]
batch_size = 1
context_length = 4096
tokenizer = %(7b_vicuna_v1_5)s
tokenizer_init_kwargs = {"use_fast": false}
model = %(7b_vicuna_v1_5)s
rerope = {"training_length": %(context_length)s}
peft: {
        "peft_attach_new": true,
        "peft_lora_rank": 16,
        "peft_lora_alpha": 16,
        "peft_lora_targets": ["gate_proj", "down_proj", "up_proj"]
    }
trainer: {
        "lr": 3e-5,
        "batch_size": %(batch_size)s,
        "optimize_cuda_cache": true
    }

test_prompt: Hello, I am Aadhira,
    I recently want to go

[gpt2]
batch_size = 2
context_length = 512
tokenizer = gpt2
tokenizer_init_kwargs = {"use_fast": false}
tokenizer_special_tokens = {"pad_token": "[PAD]"}
model = gpt2
dataset = approach0/MATH-picky-test
collate_fn = collate_finetune_phase1
peft: {
        "peft_attach_new": false
    }
trainer: {
        "lr": 3e-5,
        "batch_size": %(batch_size)s,
        "optimize_cuda_cache": true
    }

[open_ai_gpt3_5_judge_relevance]
batch_size = 1
context_length = 8000
model = openai_api
openai_init: {
        "env_token_key": "OAIKey",
        "api_type": "azure",
        "api_version": "2023-03-15-preview",
        "api_base": "https://corby.openai.azure.com",
        "engine": "gpt-35-turbo"
    }
openai_gen: {
        "temperature": 0.3,
        "max_tokens": %(context_length)s,
        "stop": null,
        "sleep_time": 5,
        "stream": false
    }
dataset = approach0/MATH-picky-test
collate_fn = collate_ask_relevance
reward_fn = reward_ask_relevance
step_fn = step_ask_relevance

[finetune_phase1__7b_vicuna_v1_5]
use_rl = False
batch_size = 12
context_length = 2048
tokenizer = %(7b_vicuna_v1_5)s
tokenizer_init_kwargs = {"use_fast": false}
model = %(7b_vicuna_v1_5)s
dataset = approach0/mathy-phase1
collate_fn = collate_finetune_phase1
peft: {
        "peft_attach_new": false
    }
trainer: [
        "--output_dir", "%(output_dir)s",
        "--save_strategy", "steps",
        "--save_steps", 100,
        "--save_total_limit", 2,
        "--report_to", "tensorboard",
        "--logging_steps", 1,
        "--per_device_train_batch_size", 1,
        "--gradient_accumulation_steps", %(batch_size)s,
        "--learning_rate", 3e-5,
        "--warmup_ratio", 0.03,
        "--optim", "adamw_torch",
        "--num_train_epochs", 3,
        "--fp16", false,
        "--bf16", true,
        "--seed", %(seed)s
    ]
deepspeed: {
        "en_param_offload": false
    }

[finetune_phase2__mathy_fft]
use_rl = False
batch_size = 8
context_length = 2048
tokenizer = %(13b_mathy_fft)s
model = %(13b_mathy_fft)s
dataset = approach0/MATH-picky-test
collate_fn = collate_phase2_learn_query
collate_add_eos = True
eval_during_train = no
peft: {
        "peft_attach_new": false
    }
trainer: [
        "--output_dir", "%(output_dir)s",
        "--save_strategy", "steps",
        "--save_steps", 10,
        "--save_total_limit", 2,
        "--evaluation_strategy", "%(eval_during_train)s",
        "--eval_steps", 10,
        "--report_to", "tensorboard",
        "--logging_steps", 1,
        "--per_device_train_batch_size", 1,
        "--gradient_accumulation_steps", %(batch_size)s,
        "--learning_rate", 3e-4,
        "--warmup_steps", 10,
        "--optim", "adamw_torch",
        "--num_train_epochs", 2,
        "--fp16", false,
        "--bf16", true,
        "--seed", %(seed)s
    ]
deepspeed: {
        "en_param_offload": false
    }

[finetune_phase2__mathy_lora]
use_rl = False
batch_size = 18
context_length = 2048
tokenizer = %(13b_mathy_fft)s
model = %(13b_mathy_fft)s
dataset = approach0/MATH-picky-test
collate_fn = collate_phase2_learn_query
eval_during_train = no
peft: {
        "peft_attach_new": true,
        "peft_lora_rank": 16,
        "peft_lora_alpha": 16,
        "peft_lora_targets": ["gate_proj", "down_proj", "up_proj"]
    }
trainer: [
        "--output_dir", "%(output_dir)s",
        "--save_strategy", "steps",
        "--save_steps", 10,
        "--save_total_limit", 2,
        "--evaluation_strategy", "%(eval_during_train)s",
        "--eval_steps", 10,
        "--report_to", "tensorboard",
        "--logging_steps", 1,
        "--per_device_train_batch_size", 1,
        "--gradient_accumulation_steps", %(batch_size)s,
        "--learning_rate", 3e-4,
        "--warmup_steps", 10,
        "--optim", "adamw_torch",
        "--num_train_epochs", 3,
        "--fp16", false,
        "--bf16", true,
        "--seed", %(seed)s
    ]
deepspeed: {
        "en_param_offload": false
    }
