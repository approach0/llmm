[finetune_phase1__7b_vicuna_v1_5]
mode = finetune
batch_size = 12
context_length = 2048
tokenizer = %(7b_vicuna_v1_5)s
tokenizer_init_kwargs = {"use_fast": false}
model = %(7b_vicuna_v1_5)s
dataset = approach0/mathy-phase1
collate_fn = collate_finetune_phase1
peft: {
        "peft_attach_new": false
    }
trainer: [
        "--output_dir", "%(output_dir)s",
        "--save_strategy", "steps",
        "--save_steps", 100,
        "--save_total_limit", 2,
        "--report_to", "tensorboard",
        "--logging_steps", 1,
        "--per_device_train_batch_size", 1,
        "--remove_unused_columns", false,
        "--gradient_accumulation_steps", %(batch_size)s,
        "--learning_rate", 3e-5,
        "--warmup_ratio", 0.03,
        "--optim", "adamw_torch",
        "--num_train_epochs", 3,
        "--fp16", false,
        "--bf16", true,
        "--seed", %(seed)s
    ]
deepspeed: {
        "en_param_offload": false
    }

