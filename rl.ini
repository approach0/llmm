[rl__learn_query_lm_by_retriever_reward]
mode = rl
batch_size = 4
rl_save_steps = 10
context_length = 2048
tokenizer = approach0/mathy-vicuna-13B-FFT-phase2
tokenizer_init_kwargs = {"use_fast": false}
model = %(tokenizer)s
#rerope = {"training_length": %(context_length)s}
#model = MockModelForQueryLM
#dataset_map_fn = datamap_debug
load_in_8bit = True
#cache_dir = ./data
compare_refout = False
dataset = approach0/MSE-duplicate-questions
collate_fn = collate_retrieve_the_dup
collate_add_eos = False
stop_fn = stop_on_common_stop_tokens
mcts_fn = rl_query_lm
reward_fn = reward_by_retriever_score
step_fn = rl_step_default
metric = pass@2
log_fn = log_rl_default
log_columns = ["qid", "Q", "dup_qid", "Q_dup"]
#"peft_lora_targets": ["q_proj", "k_proj", "v_proj"]
decode_kwargs: {
        "skip_special_tokens": false,
        "spaces_between_special_tokens": true,
        "clean_up_tokenization_spaces": true
    }
rl_respond_kwargs: {
	"batch_size": %(batch_size)s,
        "min_length": -1,
        "top_k": 0.0,
        "top_p": 1.0,
        "do_sample": true,
        "temperature": 0.5,
        "max_new_tokens": 100
    }
peft: {
        "peft_attach_new": true,
        "peft_lora_rank": 8,
        "peft_lora_alpha": 16,
        "peft_lora_targets": ["gate_proj", "down_proj", "up_proj"]
    }
trainer: {
        "lr": 1e-5,
        "warmup_steps": 100,
        "training_steps": 0,
        "log_with": "wandb",
        "batch_size": %(batch_size)s,
        "use_score_scaling": true,
        "use_score_norm": true,
        "score_clip": 1.0,
        "early_stopping": true,
        "optimize_cuda_cache": true,
        "seed": %(seed)s
    }

