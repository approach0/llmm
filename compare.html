<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8"/>
	<title>Compare</title>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<style>
iframe {
	width: 100%;
	height: 80%;
}

html {
	overflow: hidden;
}

.box {
	float: left;
	width: 50%;
}

.header {
  margin-left: 12px;
}
</style>

<body>

<input class="header" v-model="path1"/>
<input class="header" v-model="path2"/>
<input class="header" v-model="filename"/>

<div>
  <div class="box">
    <h3>Baseline</h3>
    <p>URL: <a :href="cur_url('baseline')">{{cur_url('baseline')}}</a></p>
    <iframe :src="cur_url('baseline')" frameborder="1" align="left"></iframe>
  </div>

  <div class="box">
    <h3>Method</h3>
    <p>URL: <a :href="cur_url('method')">{{cur_url('method')}}</a></p>
    <iframe :src="cur_url('method')" frameborder="1" align="right"></iframe>
  </div>
</div>

<script>
const { createApp, ref } = Vue

const app = createApp({
  data() {
    return {
      path1: '/basilisk/GCRHYPC027/method/output_merged-mathy-mammoth-13b-rl-explored__algebra/',
      path2: '/basilisk/GCRHYPC027/method/output_merged-mathy-mammoth-13b-rl-explored__algebra/',
      filename: '000597_batch0-test_algebra_1553.json.log_____p001.html',
    }
  },
  methods: {
    cur_url(which) {
      if (which == 'baseline') {
        return this.path1 + this.filename
      } else {
        return this.path2 + this.filename
      }
    }
  }
})

app.mount('body')
</script>
</body>
