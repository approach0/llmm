<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<title>Compare</title>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<style>
iframe {
	width: 100%;
	height: 100%;
}

html {
	overflow: hidden;
}

.box {
	float: left;
	width: 50%;
}

.header {
  margin-left: 12px;
}
</style>

<body>

<select class="header" v-model="path">
  <option disabled value="{{path}}">model</option>
  <option>chatgpt-2023-03-15</option>
  <option>vicuna-7b</option>
  <option>vicuna-13b</option>
  <option>vicuna-33b</option>
</select>
<input class="header" v-model="question"/>
<button class="header" @click="question -= 1">prev</button>
<button class="header" @click="question += 1">next</button>

<div>
  <div class="box">
    <h3>Baseline (direct)</h3>
    <iframe :src="'./precalculus/logname__direct-' + path + '/' + question + '.json.log_____p001.html'" frameborder="1" align="left"></iframe>
  </div>

  <div class="box">
    <h3>Retrieval-augmented</h3>
    <iframe :src="'./precalculus/logname__ia-' + path + '/' + question + '.json.log_____p001.html'" frameborder="1" align="right"></iframe>
  </div>
</div>

<script>
const { createApp, ref } = Vue

const app = createApp({
  data() {
    return {
      path: 'chatgpt-2023-03-15',
      question: 1183
    }
  }
})

app.mount('body')
</script>
</body>
